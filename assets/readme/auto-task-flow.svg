<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="260" viewBox="0 0 1200 260"
     role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">自动任务流程</title>
  <desc id="flow-desc">自动任务五步流程：打开悬浮球 → 勾选任务 → 开始执行 → 单标签页自动跨页面推进 → 领取奖励并汇报。</desc>

  <defs>
    <clipPath id="flow-round"><rect width="1200" height="260" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#flow-round)">
    <rect width="1200" height="260" fill="#15181d"/>
    <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">

      <!-- 连接箭头 -->
      <g stroke="#3a414b" stroke-width="2.5" stroke-dasharray="1 8" stroke-linecap="round" fill="none">
        <path d="M 200 84 H 320"/>
        <path d="M 430 84 H 550"/>
        <path d="M 660 84 H 780"/>
        <path d="M 890 84 H 1010"/>
      </g>
      <g fill="#3a414b">
        <path d="M 328 78 l 12 6 l -12 6 z"/>
        <path d="M 558 78 l 12 6 l -12 6 z"/>
        <path d="M 788 78 l 12 6 l -12 6 z"/>
        <path d="M 1018 78 l 12 6 l -12 6 z"/>
      </g>

      <!-- 01 悬浮球 -->
      <text x="150" y="34" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
            font-size="16" fill="#8f959e">01</text>
      <circle cx="150" cy="84" r="34" fill="#1d222a" stroke="#2a3038" stroke-width="1.5"/>
      <circle cx="150" cy="84" r="14" fill="#ffa31a"/>
      <circle cx="145.5" cy="79" r="4.5" fill="#ffffff" opacity="0.35"/>
      <text x="150" y="158" text-anchor="middle" font-size="22" fill="#f5f6f7">打开悬浮球</text>
      <text x="150" y="188" text-anchor="middle" font-size="18" fill="#8f959e">可拖动的工具入口</text>

      <!-- 02 勾选任务 -->
      <text x="375" y="34" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
            font-size="16" fill="#8f959e">02</text>
      <circle cx="375" cy="84" r="34" fill="#1d222a" stroke="#2a3038" stroke-width="1.5"/>
      <rect x="359" y="72" width="32" height="24" rx="5" fill="none" stroke="#ffa31a" stroke-width="2.2"/>
      <path d="M 366 84 l 5 5.4 l 13 -14" fill="none" stroke="#ffa31a" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="375" y="158" text-anchor="middle" font-size="22" fill="#f5f6f7">勾选任务</text>
      <text x="375" y="188" text-anchor="middle" font-size="18" fill="#8f959e">签到 · 点赞 · 收藏 · 发布</text>

      <!-- 03 开始执行 -->
      <text x="600" y="34" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
            font-size="16" fill="#8f959e">03</text>
      <circle cx="600" cy="84" r="34" fill="#1d222a" stroke="#2a3038" stroke-width="1.5"/>
      <path d="M 591 70 l 20 14 l -20 14 z" fill="#ffa31a"/>
      <text x="600" y="158" text-anchor="middle" font-size="22" fill="#f5f6f7">开始执行</text>
      <text x="600" y="188" text-anchor="middle" font-size="18" fill="#8f959e">无需逐页手动操作</text>

      <!-- 04 跨页面推进 -->
      <text x="825" y="34" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
            font-size="16" fill="#8f959e">04</text>
      <circle cx="825" cy="84" r="34" fill="#1d222a" stroke="#2a3038" stroke-width="1.5"/>
      <rect x="806" y="70" width="38" height="26" rx="5" fill="none" stroke="#ffa31a" stroke-width="2.2"/>
      <circle cx="813" cy="76.5" r="1.6" fill="#ffa31a"/>
      <circle cx="819" cy="76.5" r="1.6" fill="#ffa31a"/>
      <circle cx="825" cy="76.5" r="1.6" fill="#ffa31a"/>
      <rect x="811" y="87" width="28" height="4" rx="2" fill="#3370ff"/>
      <text x="825" y="158" text-anchor="middle" font-size="22" fill="#f5f6f7">自动推进</text>
      <text x="825" y="188" text-anchor="middle" font-size="18" fill="#8f959e">单标签页跨页面</text>

      <!-- 05 领奖汇报 -->
      <text x="1050" y="34" text-anchor="middle" font-family="ui-monospace, Consolas, monospace"
            font-size="16" fill="#8f959e">05</text>
      <circle cx="1050" cy="84" r="34" fill="#1d222a" stroke="#2a3038" stroke-width="1.5"/>
      <circle cx="1050" cy="84" r="13" fill="#ffa31a"/>
      <path d="M 1044 84 l 4.5 5 l 8.5 -10" fill="none" stroke="#15181d" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 1050 62 v -6 M 1067 70 l 5 -4 M 1033 70 l -5 -4"
            stroke="#ffa31a" stroke-width="2" stroke-linecap="round"/>
      <text x="1050" y="158" text-anchor="middle" font-size="22" fill="#f5f6f7">领奖汇报</text>
      <text x="1050" y="188" text-anchor="middle" font-size="18" fill="#8f959e">进度实时提示 · 可中止</text>

    </g>
  </g>
</svg>
