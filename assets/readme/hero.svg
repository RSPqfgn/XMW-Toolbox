<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">XMW Toolbox</title>
  <desc id="hero-desc">XMW Toolbox：小码王社区的 Tampermonkey 增强脚本，把每天重复的签到、点赞、收藏、发布、领奖交给一颗可拖动的悬浮球；右侧为自动任务面板示意。</desc>

  <defs>
    <clipPath id="hero-round"><rect width="1200" height="360" rx="26"/></clipPath>
  </defs>

  <g clip-path="url(#hero-round)">
    <rect width="1200" height="360" fill="#15181d"/>

    <!-- 左侧：标题区 -->
    <g id="title-block" transform="translate(64 0)">
      <text x="0" y="78" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace"
            font-size="19" letter-spacing="2" fill="#8f959e">TAMPERMONKEY USERSCRIPT · V2.1.0</text>

      <text x="0" y="172" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="78" font-weight="800" fill="#f5f6f7">XMW <tspan fill="#ffa31a">Toolbox</tspan></text>

      <text x="0" y="226" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="26" fill="#c9cdd4">签到 · 点赞 · 收藏 · 发布 · 领奖</text>
      <text x="0" y="264" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="26" fill="#c9cdd4">每天重复的社区操作，交给一颗悬浮球</text>

      <text x="0" y="308" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace"
            font-size="18" fill="#8f959e">world.xiaomawang.com · 两分钟装好即用</text>
    </g>

    <!-- 右侧：悬浮球（工具入口母题）+ 拖动轨迹 -->
    <g id="floating-ball">
      <path d="M 754 126 Q 774 120 788 136" fill="none"
            stroke="#3a414b" stroke-width="2.5" stroke-dasharray="1 7" stroke-linecap="round"/>
      <circle cx="726" cy="108" r="28" fill="#ffa31a"/>
      <circle cx="717" cy="98" r="9" fill="#ffffff" opacity="0.35"/>
      <path d="M 694 78 l -6 -6 M 726 70 l 0 -9 M 758 78 l 6 -6"
            stroke="#3a414b" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- 右侧：自动任务面板示意 -->
    <g id="task-panel" transform="translate(790 60)">
      <rect width="346" height="240" rx="16" fill="#1d222a" stroke="#2a3038" stroke-width="1.5"/>

      <circle cx="26" cy="30" r="6" fill="#ffa31a"/>
      <text x="42" y="37" font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
            font-size="20" font-weight="600" fill="#f5f6f7">自动任务</text>
      <line x1="22" y1="54" x2="324" y2="54" stroke="#2a3038" stroke-width="1.5"/>

      <!-- 任务行：图标 (36, y) 文本 (58, y+7) 状态右对齐 (324, y+7) -->
      <g font-family="-apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20">
        <circle cx="36" cy="86" r="10" fill="#ffa31a"/>
        <path d="M 31.5 86 l 3 3.4 l 6 -7" fill="none" stroke="#15181d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="93" fill="#e8eaed">每日签到</text>
        <text x="324" y="93" text-anchor="end" font-size="16" fill="#8f959e" font-family="ui-monospace, Consolas, monospace">已完成</text>

        <circle cx="36" cy="122" r="10" fill="#ffa31a"/>
        <path d="M 31.5 122 l 3 3.4 l 6 -7" fill="none" stroke="#15181d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="129" fill="#e8eaed">每日点赞</text>
        <text x="324" y="129" text-anchor="end" font-size="16" fill="#8f959e" font-family="ui-monospace, Consolas, monospace">已完成</text>

        <circle cx="36" cy="158" r="10" fill="#ffa31a"/>
        <path d="M 31.5 158 l 3 3.4 l 6 -7" fill="none" stroke="#15181d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="60" y="165" fill="#e8eaed">每周作品发布</text>
        <text x="324" y="165" text-anchor="end" font-size="16" fill="#8f959e" font-family="ui-monospace, Consolas, monospace">已完成</text>

        <circle cx="36" cy="194" r="10" fill="none" stroke="#ffa31a" stroke-width="2"/>
        <text x="60" y="201" fill="#e8eaed">领取奖励</text>
        <text x="324" y="201" text-anchor="end" font-size="16" fill="#ffa31a" font-family="ui-monospace, Consolas, monospace">执行中</text>
      </g>

      <rect x="22" y="218" width="302" height="8" rx="4" fill="#2a3038"/>
      <rect x="22" y="218" width="240" height="8" rx="4" fill="#3370ff"/>
    </g>
  </g>
</svg>
